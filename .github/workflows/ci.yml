name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-and-lint:
    name: Node Test & Patch Hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run control plane tests
        run: npm test

      - name: Verify patch apply dry-run
        run: npm run sync:server:apply -- --dry-run

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo check on patched server
        run: cargo check --manifest-path vendor/rustdesk-server/Cargo.toml

