services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rustdesk_control_test
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rustdesk_control_test"]
      interval: 2s
      timeout: 2s
      retries: 15
